interface:
  display_name: "Agent Seed"
  short_description: "Install and synchronize a project's core agent skills."
  default_prompt: "Use $agent-seed to resolve project policy, detect the active agent platform, install and verify the required project-local core components, and route initial or explicit full knowledge distillation to project-distiller. Keep Git helpers, ticket lookup, code tracking, and external plugins optional unless I request them or a confirmed workflow requires them."
