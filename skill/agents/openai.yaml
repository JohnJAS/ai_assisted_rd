interface:
  display_name: "Agent Seed"
  short_description: "Distill project knowledge, framework conventions, and agent runbooks."
  default_prompt: "Use $agent-seed to resolve knowledge_asset_write_mode before preflight; if no current request or shared .agents/agent-seed.json mode exists during first-run onboarding, ask me to choose a mode, recommend full-access, and persist the selected mode before installing integrations or scanning. Inspect the shared knowledge_distillation state and AGENTS.md, and start first-run onboarding when the state is missing or incomplete, or when AGENTS.md is absent even if the state is complete. Inspect external-packages.json, bundled-skills.json, and bundled-packages.json, then interview me and distill project knowledge into AGENTS.md plus agents.d runbooks. In full-access, install and verify applicable defaults without approval, require missing applicable Superpowers and OpenCLI, authorize declared install side effects, and have any failure block onboarding. In ask-each-change and agent-approve, require approval and on every activation ask about missing applicable git-code-tracker and OpenCLI before onboarding. An explicit request to redo full knowledge distillation and interviews bypasses the complete marker."
